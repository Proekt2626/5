<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тест 5. Содержание и направленность проекта</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 820px; margin: 30px auto; padding: 0 20px; background:#f7f8fa; }
  h1 { font-size: 22px; }
  .q { background:#fff; border:1px solid #ddd; border-radius:8px; padding:14px 18px; margin:14px 0; }
  .q p { margin: 0 0 10px; font-weight: bold; }
  label { display:block; padding:5px 0; cursor:pointer; }
  button { background:#4472C4; color:#fff; border:0; padding:12px 22px; font-size:16px; border-radius:8px; cursor:pointer; margin-top:14px; }
  button:hover { background:#355a9c; }
  button:disabled { background:#999; cursor:default; }
  .result { margin-top:20px; padding:16px; border-radius:8px; font-size:18px; font-weight:bold; background:#eef3ff; }
  .correct { background:#e7f5e7; border-left:4px solid #1b7a1b; padding:6px 10px; margin-top:6px; font-size:14px; }
  .wrong { background:#fde8ea; border-left:4px solid #b00020; padding:6px 10px; margin-top:6px; font-size:14px; }
</style>
</head>
<body>
<h1>Тест 5. Содержание и направленность индивидуального проекта</h1>
<p>ФИО: <input id="fio" type="text" style="max-width:320px;padding:6px;border:1px solid #bbb;border-radius:6px;"></p>
<div id="quiz"></div>
<button id="btn" onclick="check()">Проверить</button>
<div id="result"></div>

<script>
const QUESTIONS = [
  { n:"А1", t:"single", q:"Проект, относящийся к определённой области знаний, называется",
    o:["метапредметный","монопредметный","межпредметный","прикладной"], a:"монопредметный", b:1 },
  { n:"А2", t:"single", q:"Проект, направленный на сбор информации об объекте или явлении, её анализ и обобщение фактов",
    o:["исследовательский","творческий","информационный (поисковый)","игровой"], a:"информационный (поисковый)", b:1 },
  { n:"А3", t:"single", q:"Проект, подчинённый логике небольшого исследования и имеющий структуру, совпадающую с исследованием",
    o:["практико-ориентированный","исследовательский","информационный","ролевой"], a:"исследовательский", b:1 },
  { n:"А4", t:"single", q:"Проект, нацеленный на социальные интересы участников или заказчика",
    o:["творческий","игровой","практико-ориентированный (прикладной)","информационный"], a:"практико-ориентированный (прикладной)", b:1 },
  { n:"А5", t:"single", q:"Проект, участники которого принимают на себя определённые роли, обусловленные характером и содержанием проекта",
    o:["игровой (ролевой)","исследовательский","монопредметный","прикладной"], a:"игровой (ролевой)", b:1 },
  { n:"В1", t:"multi", q:"Какие из перечисленных работ могут быть результатом (продуктом) проектной деятельности?",
    o:["эссе","макет","компьютерная анимация","опрос","буклет","стендовый доклад","черновик"],
    a:["эссе","макет","компьютерная анимация","буклет","стендовый доклад"], b:2 },
  { n:"В2", t:"multi", q:"Какие формы относятся к художественным творческим работам?",
    o:["прозаическое произведение","аналитический отчёт","инсценировка","исполнение музыкального произведения","компьютерная анимация","обзорные материалы"],
    a:["прозаическое произведение","инсценировка","исполнение музыкального произведения","компьютерная анимация"], b:2 },
  { n:"D1", t:"tf", q:"К защите обучающийся должен подготовить продукт проектной деятельности",
    a:"Верно", b:1 },
  { n:"D2", t:"tf", q:"Индивидуальный итоговый проект может быть только монопредметным",
    a:"Неверно", b:1 },
  { n:"D3", t:"tf", q:"Результатом проекта может быть отчёт о проведённом исследовании",
    a:"Верно", b:1 },
  { n:"D4", t:"tf", q:"Игровой (ролевой) проект не относится к проектам по доминирующей деятельности",
    a:"Неверно", b:1 }
];

const quiz = document.getElementById("quiz");
function render() {
  QUESTIONS.forEach((q, i) => {
    const d = document.createElement("div");
    d.className = "q"; d.id = "q" + i;
    let html = `<p>${i+1}. (${q.n}) ${q.q}</p>`;
    if (q.t === "single") {
      q.o.forEach(o => html += `<label><input type="radio" name="q${i}" value="${o}"> ${o}</label>`);
    } else if (q.t === "multi") {
      q.o.forEach(o => html += `<label><input type="checkbox" name="q${i}" value="${o}"> ${o}</label>`);
    } else if (q.t === "tf") {
      ["Верно","Неверно"].forEach(o => html += `<label><input type="radio" name="q${i}" value="${o}"> ${o}</label>`);
    }
    d.innerHTML = html;
    quiz.appendChild(d);
  });
}
render();

function norm(s) { return (s || "").toString().trim().toLowerCase().replace(/\s+/g, " "); }

function check() {
  let score = 0, max = 0;
  QUESTIONS.forEach((q, i) => {
    max += q.b;
    const box = document.getElementById("q" + i);
    let ok = false, user = "";
    if (q.t === "single" || q.t === "tf") {
      const sel = document.querySelector(`input[name="q${i}"]:checked`);
      user = sel ? sel.value : "";
      ok = norm(user) === norm(q.a);
    } else if (q.t === "multi") {
      const sel = Array.from(document.querySelectorAll(`input[name="q${i}"]:checked`)).map(x => x.value);
      user = sel.join("; ");
      ok = norm(sel.slice().sort().join(";")) === norm(q.a.slice().sort().join(";"));
    }
    if (ok) { score += q.b; box.classList.add("correct"); }
    else { box.classList.add("wrong"); }
    const info = document.createElement("div");
    info.className = ok ? "correct" : "wrong";
    info.textContent = ok ? `Верно (+${q.b})` : `Неверно. Правильный ответ: ${Array.isArray(q.a) ? q.a.join("; ") : q.a}`;
    box.appendChild(info);
  });
  const percent = Math.round(score / max * 100);
  const grade = percent >= 90 ? 5 : percent >= 70 ? 4 : percent >= 50 ? 3 : 2;
  const fio = document.getElementById("fio").value || "(без ФИО)";
  document.getElementById("result").innerHTML =
    `${fio}: ${score} из ${max} баллов (${percent}%). Оценка: <b>${grade}</b>`;
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
  document.getElementById("btn").disabled = true;
}
</script>
</body>
</html>
